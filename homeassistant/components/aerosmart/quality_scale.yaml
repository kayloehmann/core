rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any service actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: Needs a PR against home-assistant/brands (icon/logo).
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: This integration does not register any service actions.
  docs-conditions:
    status: exempt
    comment: This integration does not provide any conditions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: This integration does not provide any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions:
    status: exempt
    comment: This integration does not register any service actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: A Modbus link has no authentication.
  test-coverage:
    status: todo
    comment: |
      config_flow (incl. reconfigure) and diagnostics now have dedicated
      tests; coordinator.py/entity.py/__init__.py and the five entity
      platforms still need a real coverage run (pytest-homeassistant-custom-
      component) to confirm the Silver bar -- not run locally on this box's
      constrained RAM, deferred to CI.
  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Modbus links are not discoverable.
  discovery-update-info:
    status: exempt
    comment: Modbus links are not discoverable.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: This integration always represents exactly one fixed device.
  entity-category:
    status: todo
    comment: |
      Partial: 11 clearly-diagnostic entities marked (software_version,
      device_type, zentralgeraet_adresse, and 8 presence/"_vorhanden"
      binary_sensors). The remaining ~127 entities (fault/"Störung" binary
      sensors, operating-hour counters, etc.) still need a deliberate pass --
      left alone rather than guessed at.
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No repairable issues are raised.
  stale-devices:
    status: exempt
    comment: This integration always represents exactly one fixed device.
  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: This integration talks Modbus, not HTTP.
  strict-typing:
    status: todo
    comment: |
      Added to .strict-typing and fixed the two known gaps found by manual
      review (untyped **kwargs in switch.py, untyped _subsystem property in
      entity.py). Not actually run through `mypy --strict` yet -- that needs
      a full homeassistant install, deferred to CI given this box's RAM
      headroom.
